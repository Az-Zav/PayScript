[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payscript"
dynamic = ["version"]
description = "A domain-specific language for payroll"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Victor Jazz Condicion", email = "qvjcondicion@tip.edu.ph" },
    { name = "Rhian Jannah Lacar", email = "qrjlacar@tip.edu.ph" },
    { name = "EJ Bagayan", email = "qebagayan@tip.edu.ph" },
    { name = "Jahzara Samantha San Pablo", email = "qjssanpablo@tip.edu.ph" },
    { name = "Vinea Lei De Leon", email = "qvldeleon25@tip.edu.ph" },
]

[project.urls]
Homepage = "https://github.com/Az-Zav/PayScript"
Issues = "https://github.com/Az-Zav/PayScript/issues"

[project.scripts]
payscript = "payscript.main:main"

[tool.setuptools]
packages = ["payscript"]

[tool.setuptools.dynamic]
version = {attr = "payscript.__version__"}

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Real mistakes only (unused imports/variables, undefined names, syntax errors).
# Style rules are left off on purpose.
select = ["F", "E9"]
