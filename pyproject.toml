[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payscript"
dynamic = ["version"]
description = "A domain-specific language for payroll"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[project.scripts]
payscript = "payscript.main:main"

[tool.setuptools]
packages = ["payscript"]

[tool.setuptools.dynamic]
version = {attr = "payscript.__version__"}

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Real mistakes only (unused imports/variables, undefined names, syntax errors).
# Style rules are left off on purpose.
select = ["F", "E9"]
